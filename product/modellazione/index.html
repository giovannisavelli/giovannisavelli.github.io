    <script type="module">
        import { mountTestina } from './testina-viewer.js?v=20261012b';

        function initTestina() {
            const art = document.querySelector('.gs-course-hero .gs-course-art');
            if (!art) return;
            art.classList.add('gs-course-art--testina');
            art.removeAttribute('aria-hidden');
            art.setAttribute('aria-label', 'Testolona, modello 3D interattivo');
            art.innerHTML = '<canvas id="testina-hero" tabindex="0" aria-label="Testolona in 3D. Trascina per ruotarla oppure usa le frecce sinistra e destra."></canvas><span class="gs-testina-hint" aria-hidden="true">Trascina per ruotare ↔</span><span class="gs-testina-loading" role="status" aria-live="polite">Carico Testolona…</span>';
            const loading = art.querySelector('.gs-testina-loading');
            try {
                mountTestina(art.querySelector('canvas'), loading);
            } catch (error) {
                console.error('Impossibile inizializzare Testolona:', error);
                loading.textContent = 'Il modello 3D non è disponibile. Riprova a caricare la pagina.';
            }
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initTestina, { once:true });
        else initTestina();
    </script>
