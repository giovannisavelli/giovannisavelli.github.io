<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub Docente · Prof. Giovanni Savelli | AANT</title>
    <meta name="description" content="Tutti i corsi del Prof. Giovanni Savelli - Interior Design e Product Design - Accademia delle Arti e Nuove Tecnologie">
    <meta property="og:title" content="Hub Docente · Prof. Giovanni Savelli">
    <meta property="og:description" content="Modellazione 3D, Rendering, Photoshop e Intelligenza Artificiale - AANT Interior & Product Design">
    <meta name="theme-color" content="#07080c">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #07080c;
            --surface: rgba(255, 255, 255, 0.03);
            --surface-hover: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.08);
            --border-strong: rgba(255, 255, 255, 0.16);
            --text: #f5f5f7;
            --muted: #8b8b94;
            --ok: #34d399;
            --wip: #fbbf24;
            --font-head: 'Space Grotesk', 'Inter', sans-serif;
            --font-body: 'Inter', -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, monospace;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
            font-family: var(--font-body); -webkit-font-smoothing: antialiased; overflow-x: hidden;
        }

        /* --- SFONDO TECH: griglia + luci colorate --- */
        .bg-grid {
            position: fixed; inset: 0; z-index: -2; pointer-events: none;
            background-image:
                linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
            background-size: 48px 48px;
            -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 30%, transparent 100%);
                    mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 30%, transparent 100%);
        }
        .bg-glow { position: fixed; z-index: -1; pointer-events: none; border-radius: 50%; filter: blur(90px); opacity: 0.35; }
        .bg-glow.g1 { width: 520px; height: 520px; top: -180px; left: -120px; background: #7c3aed; animation: drift 18s ease-in-out infinite alternate; }
        .bg-glow.g2 { width: 460px; height: 460px; top: -120px; right: -140px; background: #0ea5e9; animation: drift 22s ease-in-out infinite alternate-reverse; }
        @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(60px, 40px); } }

        .wrap { width: 100%; max-width: 1120px; margin: 0 auto; padding: 0 16px; }

        /* --- BARRA IN ALTO --- */
        .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 0; }
        .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text); }
        .monogram {
            width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
            font-family: var(--font-mono); font-weight: 600; font-size: 14px; letter-spacing: 0.5px;
            background: linear-gradient(var(--bg), var(--bg)) padding-box, linear-gradient(135deg, #a855f7, #0ea5e9) border-box;
            border: 1.5px solid transparent;
        }
        .brand-text { font-family: var(--font-mono); font-size: 12px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
        .brand-text b { color: var(--text); font-weight: 600; }
        .year-chip {
            display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 50px;
            border: 1px solid var(--border); background: var(--surface); font-family: var(--font-mono); font-size: 12px; color: var(--muted); white-space: nowrap;
        }
        .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.6); animation: pulse 2s infinite; }
        @keyframes pulse { 70% { box-shadow: 0 0 0 8px rgba(52, 211, 153, 0); } 100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); } }

        /* --- INTESTAZIONE --- */
        .hero { padding: 48px 0 40px; }
        .eyebrow { font-family: var(--font-mono); font-size: 12px; color: var(--muted); letter-spacing: 1px; margin: 0 0 16px; }
        .eyebrow span { color: #a78bfa; }
        h1 {
            margin: 0; font-family: var(--font-head); font-weight: 700; font-size: clamp(40px, 9vw, 80px); line-height: 1; letter-spacing: -0.03em;
            background: linear-gradient(120deg, #ffffff 30%, #c4b5fd 60%, #7dd3fc 90%); -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .lead { max-width: 600px; margin: 18px 0 0; color: var(--muted); font-size: 16px; line-height: 1.6; }
        .lead strong { color: var(--text); font-weight: 500; }

        .prompt {
            margin-top: 32px; display: inline-flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 12px;
            border: 1px solid var(--border); background: rgba(0,0,0,0.35); font-family: var(--font-mono); font-size: 14px;
        }
        .prompt .sign { color: var(--ok); }
        .caret { display: inline-block; width: 8px; height: 17px; background: var(--text); margin-left: 2px; vertical-align: -3px; animation: blink 1.1s steps(1) infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        .stats { margin-top: 14px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
        .stats b { color: var(--text); font-weight: 600; }

        /* --- SEZIONI (REPARTI) --- */
        .dept { padding: 28px 0 8px; }
        .dept-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 18px; }
        .dept-index { font-family: var(--font-mono); font-size: 12px; color: var(--dept-color); }
        .dept-title { margin: 0; font-family: var(--font-head); font-weight: 700; font-size: 26px; letter-spacing: -0.01em; }
        .dept-line { flex: 1; height: 1px; background: linear-gradient(90deg, var(--border-strong), transparent); align-self: center; }

        .grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
        @media (min-width: 680px) { .grid { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 1000px) { .grid { grid-template-columns: repeat(3, 1fr); } }

        /* --- CARD CORSO: tutta la card è un pulsante --- */
        .card {
            position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 14px; min-height: 220px; padding: 22px;
            border-radius: 18px; border: 1px solid var(--border); background: var(--surface); color: var(--text); text-decoration: none;
            transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease;
        }
        .card::before {
            content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.3s ease;
            background: radial-gradient(380px circle at var(--mx, 50%) var(--my, 0%), var(--glow), transparent 45%);
        }
        .card:hover, .card:focus-visible { transform: translateY(-3px); border-color: var(--c); background: var(--surface-hover); outline: none; }
        .card:hover::before, .card:focus-visible::before { opacity: 1; }
        .card.wip { border-style: dashed; }

        .card-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; position: relative; }
        .icon {
            width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; color: var(--c);
            background: var(--glow); border: 1px solid var(--border);
        }
        .icon svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

        .status { display: inline-flex; align-items: center; gap: 7px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.5px; text-transform: uppercase; padding: 5px 10px; border-radius: 50px; border: 1px solid var(--border); }
        .status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; }
        .status.ok { color: var(--ok); } .status.ok::before { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
        .status.wip { color: var(--wip); } .status.wip::before { background: transparent; border: 1.5px solid var(--wip); }
        .status.wait { color: var(--wip); } .status.wait::before { background: transparent; border: 1.5px solid var(--wip); }

        .card-body { position: relative; flex: 1; }
        .card h3 { margin: 0; font-family: var(--font-head); font-weight: 700; font-size: 23px; letter-spacing: -0.01em; }
        .card p { margin: 6px 0 0; color: var(--muted); font-size: 14px; line-height: 1.5; }

        .card-foot { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 14px; border-top: 1px solid var(--border); }
        .tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .tag { font-family: var(--font-mono); font-size: 11px; color: var(--muted); padding: 3px 8px; border-radius: 6px; background: rgba(255,255,255,0.04); }
        .go { font-family: var(--font-mono); font-size: 13px; font-weight: 600; color: var(--c); white-space: nowrap; transition: transform 0.25s ease; }
        .card:hover .go { transform: translateX(4px); }

        footer { margin-top: 48px; padding: 24px 0 32px; border-top: 1px solid var(--border); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }

        @media (max-width: 520px) {
            .brand-text { display: none; }
            .hero { padding: 28px 0 28px; }
        }
        @media (prefers-reduced-motion: reduce) {
            .bg-glow, .pulse, .caret { animation: none; }
            .card, .go { transition: none; }
        }
    </style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow g1"></div>
<div class="bg-glow g2"></div>

<div class="wrap">
    <div class="topbar">
        <a class="brand" href="./">
            <span class="monogram">GS</span>
            <span class="brand-text"><b>Hub Docente</b> · AANT</span>
        </a>
        <span class="year-chip"><span class="pulse"></span><span id="anno"></span></span>
    </div>

    <section class="hero">
        <p class="eyebrow"><span>//</span> AANT · Accademia delle Arti e Nuove Tecnologie</p>
        <h1>Giovanni Savelli</h1>
        <p class="lead">Modellazione 3D, Rendering, Photoshop e Intelligenza Artificiale per <strong>Interior Design</strong> e <strong>Product Design</strong>.</p>
        <div class="prompt"><span class="sign">&gt;</span> scegli il tuo corso<span class="caret"></span></div>
        <div class="stats" id="stats"></div>
    </section>

    <main id="reparti"></main>

    <footer>
        <span>© Giovanni Savelli · AANT</span>
        <span id="anno-footer"></span>
    </footer>
</div>

<script>
    // =====================================================================
    //  DATI DELL'HUB: per aggiornare l'hub basta modificare questa parte.
    //  - stato: 'disponibile' oppure 'preparazione' (materiali del corso)
    //  - calendario: 'pubblicato', 'da-definire' oppure omesso
    //  - anno:  lascia '' se non vuoi mostrarlo
    // =====================================================================
    const ANNO_ACCADEMICO = 'A.A. 2026/2027';

    const REPARTI = [
        {
            nome: 'Interior Design', colore: '#a78bfa',
            corsi: [
                { titolo: 'Rendering 3D', descrizione: 'Materiali disponibili. Calendario del 2° semestre ancora da definire.', anno: '2° anno', tag: ['Cinema 4D', 'Corona'], link: 'interior/rendering3d/#calendario', stato: 'disponibile', calendario: 'da-definire', icona: 'cubo', colore: '#9146FF', glow: 'rgba(145, 70, 255, 0.16)' },
                { titolo: 'Photoshop', descrizione: 'Calendario 2A, 2B e 2C del 1° semestre disponibile; materiali in preparazione.', anno: '2° anno', tag: ['Photoshop'], link: 'interior/photoshop/#calendario', stato: 'preparazione', calendario: 'pubblicato', icona: 'livelli', colore: '#31A8FF', glow: 'rgba(49, 168, 255, 0.14)' },
                { titolo: 'Intelligenza Artificiale', descrizione: 'Calendario 3A, 3B e 3C del 1° semestre disponibile.', anno: '3° anno', tag: ['IA generativa'], link: 'interior/ia/#calendario', stato: 'disponibile', calendario: 'pubblicato', icona: 'ia', colore: '#34d399', glow: 'rgba(52, 211, 153, 0.13)' }
            ]
        },
        {
            nome: 'Product Design', colore: '#fb923c',
            corsi: [
                { titolo: 'Modellazione 3D', descrizione: 'Modellazione 3D per il progetto di prodotto.', anno: '', tag: ['3D'], link: 'product/modellazione/', stato: 'preparazione', icona: 'compasso', colore: '#fb923c', glow: 'rgba(251, 146, 60, 0.14)' },
                { titolo: 'Photoshop', descrizione: 'Fotoritocco e post-produzione per i progetti di prodotto.', anno: '', tag: ['Photoshop'], link: 'product/photoshop/', stato: 'preparazione', icona: 'livelli', colore: '#31A8FF', glow: 'rgba(49, 168, 255, 0.14)' },
                { titolo: 'Intelligenza Artificiale', descrizione: 'Calendario PD3 del 1° semestre disponibile; materiali in preparazione.', anno: '3° anno', tag: ['IA generativa'], link: 'product/ia/#calendario', stato: 'preparazione', calendario: 'pubblicato', icona: 'ia', colore: '#34d399', glow: 'rgba(52, 211, 153, 0.13)' }
            ]
        }
    ];

    const ICONE = {
        cubo: '<svg viewBox="0 0 24 24"><path d="M12 2.5 3.5 7.2v9.6L12 21.5l8.5-4.7V7.2z"/><path d="M3.5 7.2 12 12l8.5-4.8"/><path d="M12 12v9.5"/></svg>',
        livelli: '<svg viewBox="0 0 24 24"><path d="M12 3 2.5 8 12 13l9.5-5z"/><path d="m2.5 12.5 9.5 5 9.5-5"/><path d="m2.5 16.5 9.5 5 9.5-5"/></svg>',
        ia: '<svg viewBox="0 0 24 24"><path d="M10 3.5 11.8 8.2 16.5 10l-4.7 1.8L10 16.5l-1.8-4.7L3.5 10l4.7-1.8z"/><path d="m18 14 .9 2.1L21 17l-2.1.9L18 20l-.9-2.1L15 17l2.1-.9z"/><path d="m18 3 .6 1.4L20 5l-1.4.6L18 7l-.6-1.4L16 5l1.4-.6z"/></svg>',
        compasso: '<svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><path d="M11 6.8 5.5 21"/><path d="M13 6.8 18.5 21"/><path d="M7.6 15.5h8.8"/></svg>'
    };

    // --- Costruzione delle card ---
    document.getElementById('anno').textContent = ANNO_ACCADEMICO;
    document.getElementById('anno-footer').textContent = ANNO_ACCADEMICO;

    let html = '', totale = 0, calendariPubblicati = 0;
    REPARTI.forEach((rep, i) => {
        html += `<section class="dept" style="--dept-color: ${rep.colore};">
            <div class="dept-head"><span class="dept-index">0${i + 1}</span><h2 class="dept-title">${rep.nome}</h2><span class="dept-line"></span></div>
            <div class="grid">`;
        rep.corsi.forEach(c => {
            const ok = c.stato === 'disponibile';
            const hasCalendar = c.calendario === 'pubblicato';
            const calendarPending = c.calendario === 'da-definire';
            totale++; if (hasCalendar) calendariPubblicati++;
            const statusText = hasCalendar ? 'Calendario disponibile' : calendarPending ? 'Date da definire' : ok ? 'Disponibile' : 'In preparazione';
            const statusClass = hasCalendar || ok && !calendarPending ? 'ok' : calendarPending ? 'wait' : 'wip';
            const actionText = hasCalendar ? 'Vedi calendario' : calendarPending ? 'Stato calendario' : ok ? 'Entra' : 'Info';
            const tags = (c.anno ? [c.anno] : []).concat(c.tag).map(t => `<span class="tag">${t}</span>`).join('');
            html += `
                <a class="card ${ok || hasCalendar ? '' : 'wip'}" href="${c.link}" style="--c: ${c.colore}; --glow: ${c.glow};">
                    <div class="card-top">
                        <span class="icon">${ICONE[c.icona]}</span>
                        <span class="status ${statusClass}">${statusText}</span>
                    </div>
                    <div class="card-body">
                        <h3>${c.titolo}</h3>
                        <p>${c.descrizione}</p>
                    </div>
                    <div class="card-foot">
                        <div class="tags">${tags}</div>
                        <span class="go">${actionText} →</span>
                    </div>
                </a>`;
        });
        html += `</div></section>`;
    });
    document.getElementById('reparti').innerHTML = html;
    document.getElementById('stats').innerHTML =
        `<b>${totale}</b> corsi · <b>${calendariPubblicati}</b> calendari pubblicati`;

    // --- Effetto luce che segue il mouse sulle card ---
    document.querySelectorAll('.card').forEach(card => {
        card.addEventListener('pointermove', e => {
            const r = card.getBoundingClientRect();
            card.style.setProperty('--mx', `${e.clientX - r.left}px`);
            card.style.setProperty('--my', `${e.clientY - r.top}px`);
        });
    });
</script>
</body>
</html>
